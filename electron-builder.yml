appId: com.vyxo.app
productName: VYXO
afterSign: desktop/adhoc-sign.cjs
directories:
  buildResources: desktop/resources
  output: release
files:
  - desktop/main.cjs
  - desktop/links.cjs
  - desktop/updater.cjs
  - desktop/inplace-update.cjs
  - package.json
extraResources:
  - from: .next-desktop/standalone
    to: next-server
    filter:
      - "**/*"
      - "!**/.env*"
      - "!**/*.pem"
      - "!**/memories.json"
  - from: .next-desktop/standalone/node_modules
    to: next-server/node_modules
    filter:
      - "**/*"
      - "!**/.env*"
      - "!**/*.pem"
      - "!**/memories.json"
  - from: .next-desktop/static
    to: next-server/.next-desktop/static
    filter:
      - "**/*"
  # The packages a Next.js website needs (see scripts/prepare-site-deps.mjs). Shipped so nothing is downloaded.
  - from: build/site-deps/node_modules
    to: site-deps/node_modules
    filter:
      - "**/*"
win:
  icon: desktop/resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # Not signed yet: Windows shows an "unknown publisher" warning until a code-signing certificate is added.
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  icon: desktop/resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: VYXO
publish:
  provider: github
  owner: chabdullahdev
  repo: vyxo
artifactName: "${productName}-${version}-${arch}.${ext}"
