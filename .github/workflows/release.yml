name: Release

# Push a tag like v0.2.0 to build the macOS and Windows apps. Each build is verified, then both are
# attached to one DRAFT release. Nothing is public or marked "latest" until a person publishes the draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # Without a paid certificate the build is ad-hoc signed (free). GitHub passes a missing
      # secret as an empty string, and electron-builder treats an empty CSC_LINK as a request
      # to sign, so the signing variables are only provided when the secrets really exist.
      - name: Detect a signing certificate
        env:
          CERT_PRESENT: ${{ secrets.CSC_LINK != '' }}
        run: echo "HAS_CERT=$CERT_PRESENT" >> "$GITHUB_ENV"
      - name: Build (ad-hoc signed)
        if: env.HAS_CERT != 'true'
        run: npm run desktop:dmg
      - name: Build (Developer ID signed and notarized)
        if: env.HAS_CERT == 'true'
        run: npm run desktop:dmg
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # An app whose signature does not match its contents is reported by macOS as
      # "damaged". Fail the release here rather than ship one.
      - name: Verify the app signature inside the dmg and the zip
        run: |
          set -euo pipefail
          DMG=$(ls release/*.dmg | head -n 1)
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/VYXO.app"
          codesign -dv "$MOUNT/VYXO.app" 2>&1 | grep -E "Identifier|Signature|Sealed"
          hdiutil detach "$MOUNT"
          UNZIPPED=$(mktemp -d)
          ditto -x -k "$(ls release/*.zip | head -n 1)" "$UNZIPPED"
          codesign --verify --deep --strict --verbose=2 "$UNZIPPED/VYXO.app"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      # Not code-signed yet: Windows shows an "unknown publisher" warning before the first launch.
      - run: npm run desktop:win
      - name: Check the installer and its update file exist
        run: ls release/*-x64.exe release/*-x64.exe.blockmap release/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  # One draft release with both apps, created only after both builds passed.
  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft --generate-notes --title "$GITHUB_REF_NAME"
