name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like VYXO to do?
  - type: markdown
    attributes:
      value: VYXO stays local-first, so ideas that send content off the machine are unlikely to fit.
